name: Windows build

# 在 Windows 云端编译教师端 + 学生端为 exe。
#  - 推送到 main/master 或手动触发：产物作为 Artifact 上传（需登录下载，会过期）。
#  - 推送 vX.Y.Z 形式的 tag：额外创建 GitHub Release 并附带 zip（永久下载链接）。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # 允许用内置 token 创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc --bin labctl-teacher --bin labctl-student

      - name: Stage package
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force dist/LabCtl/scripts | Out-Null
          Copy-Item "$bin/labctl-teacher.exe" dist/LabCtl/
          Copy-Item "$bin/labctl-student.exe" dist/LabCtl/
          Copy-Item "$bin/labctl-student.exe" dist/LabCtl/scripts/
          Copy-Item README.md dist/LabCtl/
          Copy-Item scripts/install-student.ps1   dist/LabCtl/scripts/
          Copy-Item scripts/install-student.bat   dist/LabCtl/scripts/
          Copy-Item scripts/uninstall-student.ps1 dist/LabCtl/scripts/
          Copy-Item scripts/deploy-lab.ps1        dist/LabCtl/scripts/
          @"
          @echo off
          cd /d "%~dp0"
          start "" "labctl-teacher.exe"
          timeout /t 2 >nul
          start "" http://127.0.0.1:8080
          "@ | Set-Content -Path dist/LabCtl/启动教师端.bat -Encoding OEM
          Compress-Archive -Path dist/LabCtl -DestinationPath LabCtl-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabCtl-windows
          path: dist/LabCtl

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LabCtl-windows.zip
          generate_release_notes: true
