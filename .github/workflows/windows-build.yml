name: Windows build

# 在 Windows 云端编译教师端 + 学生端为 exe。
#  - 推送到 main/master 或手动触发：产物作为 Artifact 上传（需登录下载，会过期）。
#  - 推送 vX.Y.Z 形式的 tag：额外创建 GitHub Release 并附带 zip（永久下载链接）。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # 允许用内置 token 创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc --bin labctl-teacher --bin labctl-student

      - name: Stage package
        id: stage
        shell: pwsh
        run: |
          # Version comes from Cargo.toml [workspace.package]; it names every package.
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                  Select-Object -First 1).Matches.Groups[1].Value
          if (-not $ver) { throw "version not found in Cargo.toml" }
          $name = "LabCtl-$ver"
          $dir = "dist/$name"
          $bin = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force "$dir/scripts" | Out-Null
          Copy-Item "$bin/labctl-teacher.exe" "$dir/"
          Copy-Item "$bin/labctl-student.exe" "$dir/"
          Copy-Item "$bin/labctl-student.exe" "$dir/scripts/"
          Copy-Item README.md "$dir/"
          Copy-Item scripts/install-student.ps1   "$dir/scripts/"
          Copy-Item scripts/install-student.bat   "$dir/scripts/"
          Copy-Item scripts/uninstall-student.ps1 "$dir/scripts/"
          Copy-Item scripts/deploy-lab.ps1        "$dir/scripts/"
          @"
          @echo off
          cd /d "%~dp0"
          start "" "labctl-teacher.exe"
          "@ | Set-Content -Path "$dir/启动教师端.bat" -Encoding OEM
          Compress-Archive -Path $dir -DestinationPath "$name-windows.zip" -Force
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}-windows
          path: dist/${{ steps.stage.outputs.name }}

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.name }}-windows.zip
          generate_release_notes: true
